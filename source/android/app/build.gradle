plugins {
    id 'com.android.application'
}

android {
    namespace 'com.etzify.pcremote'
    compileSdk 34

    defaultConfig {
        applicationId "com.etzify.pcremote"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the produced APK installs directly.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
